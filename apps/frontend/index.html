<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Real-time IoT Anomaly Detection Dashboard - Monitor and receive instant alerts for IoT anomalies">
  <title>IoT Anomaly Alerts | Real-time Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <span class="logo-icon">🚨</span>
          <h1>IoT Anomaly Alerts</h1>
        </div>
        <div class="header-controls">
          <div class="connection-status" id="connectionStatus">
            <span class="status-dot"></span>
            <span class="status-text">Connecting...</span>
          </div>
          <button class="btn-icon" id="soundToggle" title="Toggle sound">
            🔔
          </button>
          <button class="btn-icon" id="clearAlerts" title="Clear all alerts">
            🗑️
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Stats Cards -->
      <section class="stats-grid">
        <div class="stat-card stat-total">
          <div class="stat-value" id="totalCount">0</div>
          <div class="stat-label">Total Alerts</div>
        </div>
        <div class="stat-card stat-critical">
          <div class="stat-value" id="criticalCount">0</div>
          <div class="stat-label">Critical</div>
        </div>
        <div class="stat-card stat-high">
          <div class="stat-value" id="highCount">0</div>
          <div class="stat-label">High</div>
        </div>
        <div class="stat-card stat-medium">
          <div class="stat-value" id="mediumCount">0</div>
          <div class="stat-label">Medium</div>
        </div>
      </section>

      <!-- Alerts Section -->
      <section class="alerts-section">
        <div class="section-header">
          <h2>Real-time Alerts</h2>
          <span class="badge" id="alertBadge">Live</span>
        </div>
        
        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">📡</div>
          <h3>Waiting for Anomalies</h3>
          <p>When anomalies are detected, they will appear here in real-time.</p>
        </div>

        <!-- Alerts List -->
        <div class="alerts-list" id="alertsList">
          <!-- Alerts will be dynamically inserted here -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>IoT Real-time Anomaly Detection System</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
